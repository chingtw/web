<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>肥宅酒池肉林踩雷衝Live團花錢快樂登記網</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/fontawesome/all.css">

    <!-- Modern Styles -->
    <link rel="stylesheet" href="css/modern.css">
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/animations/scale.css" />

    <!-- External Libs (Keeping SweetAlert2/Tippy as requested) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10.12.3/dist/sweetalert2.all.min.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
</head>

<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 10px; font-weight: 500;">處理中...</p>
    </div>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <div class="header-icon">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h1>日本包裹轉運中心</h1>
            <p class="text-muted">肥宅酒池肉林踩雷衝Live團夥伴們的快樂購物集散地</p>
        </header>

        <!-- Notification Banner -->
        <div class="notification-banner" id="notification-banner">
            <i class="fa-solid fa-bell" style="color: var(--color-primary);"></i>
            <span><strong>網站更新：</strong> UIUX介面優化升級，提供更流暢的行動裝置體驗。</span>
        </div>

        <!-- Navigation -->
        <div class="nav-wrapper">
            <div class="segmented-control">
                <div class="nav-item active" data-target="section-address">倉庫地址</div>
                <div class="nav-item" data-target="section-register">包裹登記</div>
                <div class="nav-item" data-target="section-return">出貨回填</div>
            </div>
        </div>

        <!-- Section 1: Japan Warehouse Address -->
        <section id="section-address" class="section active">
            <div class="card">
                <h3><i class="fa-solid fa-map-location-dot" style="margin-right: 8px;"></i>日本倉庫收件地址</h3>
                <p style="margin-bottom: 24px;">網購時請填寫以下資訊，點擊右側按鈕即可複製。</p>

                <form id="jpForm">
                    <div class="address-grid">
                        <div class="info-group">
                            <label class="info-label">〒 郵便番号 (Zip Code)</label>
                            <div class="info-value-wrapper">
                                <input class="info-value" value="595-0813" readonly id="addr-zip">
                                <button type="button" class="copy-btn" data-copy-target="addr-zip"><i class="fa-solid fa-copy"></i></button>
                            </div>
                        </div>

                        <div class="info-group">
                            <label class="info-label">都道府県 (Prefecture)</label>
                            <div class="info-value-wrapper">
                                <input class="info-value" value="大阪府" readonly id="addr-pref">
                                <button type="button" class="copy-btn" data-copy-target="addr-pref"><i class="fa-solid fa-copy"></i></button>
                            </div>
                        </div>

                        <div class="info-group">
                            <label class="info-label">市区町村 (City/Ward)</label>
                            <div class="info-value-wrapper">
                                <input class="info-value" value="泉北郡忠岡町" readonly id="addr-city">
                                <button type="button" class="copy-btn" data-copy-target="addr-city"><i class="fa-solid fa-copy"></i></button>
                            </div>
                        </div>

                        <div class="info-group">
                            <label class="info-label">以降の住所 (Address Line 1)</label>
                            <div class="info-value-wrapper">
                                <input class="info-value" value="忠岡南3-1514-7" readonly id="addr-line1">
                                <button type="button" class="copy-btn" data-copy-target="addr-line1"><i class="fa-solid fa-copy"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="info-group" style="margin-top: 16px;">
                        <label class="info-label">マンション・ビル名 (Building/Room/Member ID)</label>
                        <div class="info-value-wrapper">
                            <input class="info-value" value="JT0872147-01" readonly id="addr-bldg">
                            <button type="button" class="copy-btn" data-copy-target="addr-bldg"><i class="fa-solid fa-copy"></i></button>
                        </div>
                    </div>

                    <div class="address-grid" style="margin-top: 16px;">
                        <div class="info-group">
                            <label class="info-label">お名前 (Name)</label>
                            <div class="info-value-wrapper">
                                <input class="info-value" value="SUN CHENG CHING" readonly id="addr-name">
                                <button type="button" class="copy-btn" data-copy-target="addr-name"><i class="fa-solid fa-copy"></i></button>
                            </div>
                        </div>

                        <div class="info-group">
                            <label class="info-label">電話番号 (Phone)</label>
                            <div class="info-value-wrapper">
                                <input class="info-value" value="06-6245-7385" readonly id="addr-phone">
                                <button type="button" class="copy-btn" data-copy-target="addr-phone"><i class="fa-solid fa-copy"></i></button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Mobile Image Decoration -->
            <div style="border-radius: var(--radius-lg); overflow: hidden; margin-top: 20px;">
                <img src="images/pexels-photo-4464817.jpeg" alt="Japan Style" style="width: 100%; height: 200px; object-fit: cover;">
            </div>
        </section>

        <!-- Section 2: Package Registration (Google Form) -->
        <section id="section-register" class="section">
             <div class="card">
                <h3><i class="fa-solid fa-pen-to-square" style="margin-right: 8px;"></i>日本包裹登記</h3>
                <p>網購後請填寫此表單，以便倉庫核對。</p>
                <div class="iframe-container">
                    <iframe id="frameid"
                        src="https://docs.google.com/forms/d/e/1FAIpQLSfMzmiAD4hSvATXx5ZEBPKaQm46pwPN2jyrd4DW2U_jscao4w/viewform?embedded=true"
                        frameborder="0" marginheight="0" marginwidth="0">載入中…</iframe>
                </div>
             </div>
        </section>

        <!-- Section 3: Shipment Return (Custom Form) -->
        <section id="section-return" class="section">
            <div class="card">
                <h3><i class="fa-solid fa-truck-fast" style="margin-right: 8px;"></i>包裹出貨回填</h3>
                <p>收到廠商出貨通知後，請在此回填單號。</p>

                <!-- Step 1: Search -->
                <div class="form-group" style="max-width: 500px; margin: 0 auto;">
                    <label class="form-label">查詢您的代號/暱稱</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="search-name" class="form-input" placeholder="輸入當初登記的名稱">
                        <button id="search-btn" class="btn btn-primary" style="width: auto;">查詢</button>
                    </div>
                </div>

                <!-- Step 2: Select Package -->
                <div id="search-result-area" class="hidden" style="margin-top: 30px; border-top: 1px solid var(--color-border); padding-top: 20px;">
                    <h4 class="text-center" style="margin-bottom: 20px;">請選擇要回填的包裹</h4>
                    <div id="package-list">
                        <!-- Buttons injected by JS -->
                    </div>
                </div>

                <!-- Step 3: Detail Form -->
                <div id="return-form-details" class="hidden" style="margin-top: 30px; background: #fafbfc; padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--color-border);">
                    <form id="return-form">

                        <div class="address-grid">
                            <div class="form-group">
                                <label class="form-label">出貨商品</label>
                                <input type="text" id="input-product" class="form-input" disabled>
                            </div>
                             <div class="form-group">
                                <label class="form-label">訂購類別</label>
                                <input type="text" id="input-type" class="form-input" disabled>
                            </div>
                        </div>

                        <div class="address-grid">
                            <div class="form-group">
                                <label class="form-label">出貨平台</label>
                                <input type="text" id="input-platform" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label">金額</label>
                                <input type="text" id="input-money" class="form-input">
                            </div>
                        </div>

                        <div class="address-grid">
                            <div class="form-group">
                                <label class="form-label">出貨通知日期</label>
                                <input type="date" id="input-date" class="form-input">
                            </div>
                             <div class="form-group">
                                <label class="form-label">日本國內物流</label>
                                <select id="select-delivery" class="form-select" style="margin-bottom: 8px;">
                                    <option value="0">請選擇物流公司</option>
                                    <option value="Amazon co jp">Amazon co jp</option>
                                    <option value="佐川急便株式会社">佐川急便 Sagawa</option>
                                    <option value="ヤマト運輸株式会社">ヤマト運輸 (黑貓)</option>
                                    <option value="日本郵便">日本郵便</option>
                                    <option value="其他">其他 (自行輸入)</option>
                                </select>
                                <input type="text" id="input-delivery-company" class="form-input" placeholder="物流公司名稱">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">物流單號 (Tracking Number)</label>
                            <input type="text" id="input-delivery-no" class="form-input" placeholder="請輸入單號">
                        </div>

                        <div class="address-grid">
                            <div class="form-group">
                                <label class="form-label">特殊注意事項</label>
                                <select id="select-notice" class="form-select" style="margin-bottom: 8px;">
                                    <option value="0">請選擇</option>
                                    <option value="無">無</option>
                                    <option value="大型重量">重型玩偶/非固定大型物件</option>
                                    <option value="海報">海報</option>
                                    <option value="易碎">易碎商品</option>
                                    <option value="其他">其他</option>
                                </select>
                                <input type="text" id="input-notice" class="form-input" placeholder="注意事項">
                            </div>

                            <div class="form-group">
                                <label class="form-label">急件處理?</label>
                                <div class="radio-group">
                                    <label class="radio-item">
                                        <input type="radio" name="urgent" value="是"> 是 (立即集貨)
                                    </label>
                                    <label class="radio-item">
                                        <input type="radio" name="urgent" value="否" checked> 否 (一般集貨)
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div style="display: flex; gap: 10px; margin-top: 20px;">
                            <button type="button" id="btn-submit-return" class="btn btn-primary">確認送出</button>
                            <button type="button" id="btn-reset" class="btn btn-secondary">重新選擇</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

    </main>

    <!-- App Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#C5A489">
    <title>NO LIVE NO LIFE - CHING Live Records</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23C5A489' d='M2 9a2 2 0 0 1 2-2h24a2 2 0 0 1 2 2v3a3 3 0 0 0 0 6v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-3a3 3 0 0 0 0-8V9z'/><line x1='22' y1='7' x2='22' y2='25' stroke='%23000' stroke-width='1' stroke-dasharray='1.5,1.5' opacity='0.5'/><path fill='%23000' opacity='0.3' d='M10 12l1.2 2.4 2.6.4-1.9 1.8.4 2.6-2.3-1.2-2.3 1.2.4-2.6-1.9-1.8 2.6-.4z'/></svg>">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/180/C5A489/ticket.png">
    <!-- Google Fonts: 票券字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <!-- MapTiler SDK (WebGL Vector Map) -->
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v2.0.3/maptiler-sdk.umd.js"></script>
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v2.0.3/maptiler-sdk.css" rel="stylesheet" />
    <!-- Google Maps API (Places Autocomplete) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXZCtuPbX5xe9tyLsyVfPvMNzFistALHo&libraries=places&language=zh-TW" async defer></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css?v=6.3.3.1">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="dynamic-logo-container loading" id="main-logo">
                <!-- 字母會透過 JS 動態產生 -->
            </div>
            <p class="subtitle">CHING 参戦記録</p>
        </div>

        <!-- Live Status Strip -->
        <div id="live-status-strip" class="live-status-strip hidden"></div>

        <div class="tabs">
            <!-- Hamburger Button -->
            <button id="menu-btn" class="tab-btn icon-btn" onclick="toggleMenu()">
                <i data-lucide="menu"></i>
            </button>
            
            <button class="tab-btn active" data-tab="list">TICKETS</button>
            <button class="tab-btn" data-tab="map">MAP</button>
            <button class="tab-btn" data-tab="stats">STATS</button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Back Button (Hidden by default) -->
        <div id="back-btn-container" style="display:none; margin-bottom: 1rem;">
            <button onclick="showAllTickets()" style="background:transparent; border:1px solid #777; color:#ccc; padding:5px 15px; cursor:pointer; display:flex; align-items:center; gap:5px; border-radius:4px;">
                <i data-lucide="arrow-left"></i> Back to Tickets
            </button>
        </div>

        <!-- Tab 1: List View -->
        <section id="list-view" class="active">
            <div class="filter-categories">
                <button class="cat-btn active" data-cat="date">YEAR</button>
                <button class="cat-btn" data-cat="artist">ARTIST</button>
                <button class="cat-btn" data-cat="status">STATUS</button>
                <button class="cat-btn" data-cat="milestone">MILESTONE</button>
                <div id="filter-addon"></div>
            </div>

            <div id="year-filter" class="year-filter-bar">
                <!-- Chips injected by JS -->
            </div>

            <!-- 列表控制列 (提供 3D 切換與票券總數顯示) -->
            <div class="list-toolbar">
                <div id="ticket-count" class="ticket-count"></div>
                <button id="toggle-3d-btn" class="toolbar-btn active" onclick="toggle3DMode()">
                    <i data-lucide="layers" style="width:14px; height:14px;"></i>
                    <span>3D VIEW</span>
                </button>
            </div>
            
            <!-- Skeleton Screen Loading -->
            <div id="loading" class="skeleton-container">
                <div class="skeleton-ticket"></div>
                <div class="skeleton-ticket"></div>
                <div class="skeleton-ticket"></div>
            </div>

            <div id="ticket-container" class="ticket-list">
                <!-- Tickets will be injected here by JS -->
            </div>
        </section>

        <!-- Tab 2: Map View -->
        <section id="map-view">
            <div id="map"></div>
        </section>

        <!-- Tab 3: Stats View -->
        <section id="stats-view">
            <h2 class="animate-fade">STATS</h2>
            <div class="stats-switcher">
                <button class="switcher-btn active" data-stats="artist">ARTIST</button>
                <button class="switcher-btn" data-stats="venue">VENUE</button>
                <button class="switcher-btn" data-stats="type">TYPE</button>
                <button class="switcher-btn" data-stats="cost">COST</button>
            </div>
            <div class="stats-container active-artist">
                <div class="stats-card" id="card-artist">
                    <h3>ARTIST RANKING</h3>
                    <div class="ranking-mode-switcher" aria-label="Artist ranking mode">
                        <button class="ranking-mode-btn active" data-ranking-mode="inPerson" type="button">REAL ATTENDANCE</button>
                        <button class="ranking-mode-btn" data-ranking-mode="full" type="button">FULL EXPERIENCE</button>
                    </div>
                    <div class="ranking-sort-control" aria-label="Artist ranking sort">
                        <span class="ranking-sort-label">SORT BY</span>
                        <div class="ranking-sort-switcher">
                            <button class="ranking-sort-btn active" data-ranking-sort="count" type="button">COUNT</button>
                            <button class="ranking-sort-btn" data-ranking-sort="name" type="button">NAME</button>
                        </div>
                    </div>
                    <div class="chart-wrapper"><canvas id="artistChart"></canvas></div>
                    <div id="artist-stats-list" class="stats-list"></div>
                </div>
                <div class="stats-card" id="card-venue">
                    <h3>VENUE RANKING</h3>
                    <div class="ranking-sort-control" aria-label="Venue ranking sort">
                        <span class="ranking-sort-label">SORT BY</span>
                        <div class="ranking-sort-switcher">
                            <button class="venue-sort-btn active" data-venue-sort="count" type="button">COUNT</button>
                            <button class="venue-sort-btn" data-venue-sort="overseas" type="button">OVERSEAS</button>
                        </div>
                    </div>
                    <div class="chart-wrapper"><canvas id="venueChart"></canvas></div>
                    <div id="venue-stats-list" class="stats-list"></div>
                </div>
                <div class="stats-card" id="card-type">
                    <h3>EVENT TYPE</h3>
                    <div class="chart-wrapper"><canvas id="typeChart"></canvas></div>
                    <div id="type-stats-list" class="stats-list"></div>
                </div>
                <div class="stats-card" id="card-cost">
                    <h3>EXPENDITURE</h3>
                    <div id="annual-attendance-list" class="annual-grid"></div>
                    <div style="margin-top:20px;" id="cost-stats-list"></div>
                    <p style="color:#444; font-size:0.7rem; margin-top:20px; text-align:center; font-family:'Bebas Neue'; letter-spacing:1px;">* Includes confirmed & completed records only</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal: Ticket Detail / Add Form -->
    <div id="modal" class="modal hidden">
        <div class="modal-content ticket-style-modal">
            <button class="close-modal" onclick="closeModal()" aria-label="Close modal"></button>
            <div id="modal-admin-tool" style="position: absolute; top: 15px; left: 20px; z-index: 101;"></div>
            <div id="modal-body">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal hidden">
        <div class="modal-content login-box">
            <h2>Admin Access</h2>
            <input type="password" id="admin-pass" placeholder="Enter Password">
            <button onclick="checkLogin()">Unlock</button>
            <p id="login-msg"></p>
        </div>
    </div>

    <!-- Side Drawer Menu -->
    <div id="side-menu-overlay" class="menu-overlay hidden" onclick="toggleMenu()"></div>
    <div id="side-menu" class="side-menu">
        <div class="menu-header"><h3>HISTORY <span class="jp-title">/ 履歴</span></h3><span class="close-menu" onclick="toggleMenu()">&times;</span></div>
        <div class="menu-body">
            <div id="menu-content">
                <!-- Dynamic List Injected by JS -->
            </div>
            <div id="menu-nav" class="menu-nav">
                <!-- Year links injected by JS -->
            </div>
        </div>
        <div class="menu-footer" style="padding: 1rem 2rem; border-top: 1px solid #111; display: flex; justify-content: space-between; align-items: center; gap: 10px;">
            <button onclick="forceClearCacheAndReload()" style="background:transparent; color:#666; border:1px solid #333; padding:5px 10px; font-family:'Bebas Neue'; border-radius:4px; cursor:pointer; font-size:0.8rem; letter-spacing:1.5px; display:flex; align-items:center; gap:5px;" title="Update App & Clear Cache">
                <i data-lucide="refresh-cw" style="width:12px; height:12px;"></i> UPDATE APP
            </button>
            <button id="admin-add-btn" onclick="showAdminForm()" style="background:var(--text-accent); color:black; border:none; padding:5px 15px; font-family:'Bebas Neue'; border-radius:4px; cursor:pointer; font-size:1rem; letter-spacing:1px;">+ ADD TICKET</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <p>Developed by CHING</p>
    </footer>

    <!-- Scroll to Top Button -->
    <button id="scroll-top-btn" class="scroll-top-btn">
        <i data-lucide="arrow-up"></i>
    </button>

    <!-- Scroll Timeline Indicator -->
    <div id="scroll-timeline" class="scroll-timeline-container">
        <div class="scroll-timeline-track top"></div>
        <div class="scroll-year-group">
            <span id="scroll-year-prev" class="scroll-year-sub">2024</span>
            <div class="scroll-year-pill">
                <span id="scroll-year-text">2025</span>
            </div>
            <span id="scroll-year-next" class="scroll-year-sub">2026</span>
        </div>
        <div class="scroll-timeline-track bottom"></div>
    </div>

    <!-- Main Script -->
    <script src="script.js?v=6.3.3.1"></script>
    <script>
        lucide.createIcons();
    </script>
    
    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                    .then(reg => {
                        console.log('SW Registered successfully:', reg.scope);
                        
                        // 主動觸發一次 Service Worker 的更新檢查
                        reg.update();
                        
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    if (typeof showAlert === 'function') {
                                        showAlert('偵測到系統版本更新，已為您載入最新內容！', 'success').then(() => {
                                            window.location.reload();
                                        });
                                    } else {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(err => console.error('SW Registration failed:', err));
            });

            // 監聽 controllerchange 事件，當新的 Service Worker 奪取控制權時自動重整頁面
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>

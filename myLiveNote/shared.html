    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/180/C5A489/ticket.png">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <style>
        /* Portal Overlay 專屬樣式 (與主站風格統一) */
        #portal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* 改為從頂部開始，方便滑動 */
            padding: 60px 20px; /* 增加上下內距 */
            overflow-y: hidden; /* 預設禁止滑動，載入後才開啟 */
            transition: opacity 0.5s ease;
            -webkit-overflow-scrolling: touch; /* iOS 流暢滑動 */
        }
        #portal-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .portal-content { text-align: center; max-width: 1000px; width: 100%; }
        .portal-title { 
            font-family: 'Bebas Neue'; font-size: 4.5rem; color: var(--text-accent); letter-spacing: 5px; margin-bottom: 0.5rem; 
            animation: fadeInDown 1s ease both;
        }
        .user-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-top: 3rem; }
        .user-card { 
            background: rgba(20, 20, 20, 0.8); border: 1px solid #222; padding: 30px; border-radius: 12px; cursor: pointer; transition: all 0.4s ease; backdrop-filter: blur(10px); 
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }
        .user-card:hover { transform: translateY(-12px); border-color: var(--text-accent); }
        .user-avatar { width: 90px; height: 90px; border-radius: 50%; background: #111; margin: 0 auto 1.5rem; border: 2px solid #333; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-name { font-family: 'Bebas Neue'; font-size: 2rem; color: #eee; }
        .user-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 3px 12px;
            font-family: 'Bebas Neue';
            font-size: 0.75rem;
            letter-spacing: 2px;
            border-radius: 2px;
            color: #444;
            border: 1px solid #222;
            transition: all 0.3s ease;
        }
        .user-card:hover .user-badge {
            color: var(--text-accent);
            border-color: var(--text-accent);
            background: rgba(197, 164, 137, 0.05);
        }
        .portal-subtitle {
            color: #555;
            font-family: 'Bebas Neue';
            letter-spacing: 4px;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            animation: fadeIn 1s ease 0.3s both;
        }
        .portal-subtitle span {
            font-family: 'Noto Sans TC';
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-left: 10px;
            opacity: 0.6;
        }
        
        /* Quick Switcher Floating UI (右下角) */
        .quick-switch-container {
            position: fixed;
            bottom: 85px; /* 在 scroll-top-btn (20px) + btn高度(50px) + 間距 之後 */
            right: 20px;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            transition: all 0.3s ease; /* 新增過渡效果 */
        }

        #quick-user-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 5px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #quick-user-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .quick-user-item {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #333;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .quick-user-item:hover {
            transform: scale(1.15);
            border-color: var(--text-accent);
        }
        .quick-user-item.active {
            border-color: var(--text-accent);
            box-shadow: 0 0 15px rgba(197, 164, 137, 0.4);
        }
        .quick-user-item img { width: 100%; height: 100%; object-fit: cover; }
        
        /* 懸浮按鈕樣式 - 預設更輕量的半透明 */
        .quick-switch-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .quick-switch-btn:hover { background: rgba(50, 50, 50, 0.7); transform: scale(1.05); }
        .quick-switch-btn.active { 
            background: var(--text-accent); 
            color: #000; 
            border-color: var(--text-accent);
            box-shadow: 0 0 20px rgba(197, 164, 137, 0.4);
        }

        /* 選單展開時的背景遮罩 - 調淡並修復衝突 */
        .quick-menu-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 9997;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .quick-menu-backdrop.open { opacity: 1; visibility: visible; pointer-events: auto; }

        /* 確保置頂按鈕在遮罩之上 */
        #scroll-top-btn { z-index: 9999; }

        /* 當開啟詳細頁面(光箱)時，隱藏多使用者切換按鈕，避免擋住翻轉按鈕 */
        body.no-scroll .quick-switch-container {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 手機版適應：改為 2 欄排版 */
        @media (max-width: 600px) {
            #portal-overlay { padding: 40px 15px; }
            .portal-title { font-size: 3.5rem; }
            .user-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 2rem; }
            .user-card { padding: 20px 10px; }
            .user-avatar { width: 70px; height: 70px; margin-bottom: 1rem; }
            .user-name { font-size: 1.5rem; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        /* PWA Install Banner */
        .pwa-install-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 164, 137, 0.35);
            padding: 10px 16px;
            border-radius: 12px;
            z-index: 100001;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            animation: fadeInUp 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) both;
            max-width: 95vw;
            width: 380px;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            box-sizing: border-box;
        }
        /* 滑動時縮下去隱藏的類別 */
        .pwa-install-banner.hidden-scroll {
            transform: translate(-50%, 180%);
            opacity: 0;
            pointer-events: none;
        }
        .pwa-install-banner.hidden { display: none !important; }
        .pwa-icon { color: var(--text-accent); font-size: 18px; flex-shrink: 0; display: flex; align-items: center; }
        .pwa-info { flex: 1; min-width: 0; overflow: hidden; }
        .pwa-info h4 { 
            font-family: 'Bebas Neue'; color: var(--text-accent); font-size: 1.1rem; 
            margin: 0; letter-spacing: 1px; line-height: 1.2;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pwa-info p { 
            color: #888; font-size: 0.7rem; margin: 2px 0 0; 
            font-family: 'Noto Sans TC'; letter-spacing: 0.5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pwa-btn {
            background: var(--text-accent); color: #000; border: none; padding: 6px 12px;
            border-radius: 4px; font-family: 'Bebas Neue'; font-size: 0.9rem; cursor: pointer;
            white-space: nowrap; transition: all 0.3s; letter-spacing: 1px;
            flex-shrink: 0; /* 確保按鈕不被擠壓 */
            min-width: 80px; /* 保證按鈕寬度 */
        }
        .pwa-btn:hover { background: #d6b89f; transform: scale(1.05); }
        .pwa-close { color: #555; cursor: pointer; font-size: 1.2rem; line-height: 1; margin-left: 2px; transition: color 0.3s; flex-shrink: 0; }
        .pwa-close:hover { color: #888; }

        @media (max-width: 600px) {
            .pwa-install-banner { 
                width: 92%; 
                bottom: 12px; /* 稍微再往下移，遠離垂直選單 */
                padding: 8px 12px; 
                gap: 8px; 
            }
            .pwa-info p { display: none; } /* 窄螢幕隱藏副標題，騰出空間給按鈕 */
            .pwa-info h4 { font-size: 1rem; }
            .pwa-btn { padding: 5px 10px; font-size: 0.85rem; min-width: 70px; }
            .pwa-icon { font-size: 16px; }
        }
    </style>
</head>

    <!-- PWA Install Prompt -->

            <p>將此應用程式加入主畫面，獲得完整使用體驗。</p>
        </div>

    <script src="script.js"></script>
    <script>
        // PWA Install Logic
        let deferredPrompt;
        const pwaBanner = document.getElementById('pwa-banner');
        const installBtn = document.getElementById('pwa-install-btn');

        // 偵測是否已是 Web App 模式 (Standalone)
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        const isDismissed = localStorage.getItem('pwa-dismissed') === 'true';

        window.addEventListener('beforeinstallprompt', (e) => {
            // 防止瀏覽器自動顯示預設提示
            e.preventDefault();
            deferredPrompt = e;
            
            // 只有在非 App 模式且沒被關閉過時才顯示
            if (!isStandalone && !isDismissed) {
                setTimeout(() => {
                    pwaBanner.classList.remove('hidden');
                    lucide.createIcons();
                }, 3000); // 延遲 3 秒顯示，避免干擾入口動畫
            }
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    pwaBanner.classList.add('hidden');
                }
                deferredPrompt = null;
            } else {
                // 如果瀏覽器不支援直接觸發，給予提示
                alert('請點擊瀏覽器選單中的「安裝應用程式」或「加入主畫面」。');
            }
        });

        window.dismissPwaBanner = () => {
            pwaBanner.classList.add('hidden');
            localStorage.setItem('pwa-dismissed', 'true');
        };

        // iOS 額外提示判定 (iOS 不支援 beforeinstallprompt)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS && !isStandalone && !isDismissed) {
            setTimeout(() => {
                const pwaDesc = pwaBanner.querySelector('p');
                pwaDesc.textContent = '點擊「分享」並選擇「加入主畫面」';
                installBtn.style.display = 'none'; // iOS 無法程式觸發，隱藏按鈕改由文字提示
                pwaBanner.classList.remove('hidden');
                lucide.createIcons();
            }, 4000);
        }

        // 捲動隱藏邏輯
        let scrollTimer = null;
        window.addEventListener('scroll', () => {
            if (pwaBanner.classList.contains('hidden') || isDismissed) return;

            // 開始捲動時隱藏
            pwaBanner.classList.add('hidden-scroll');

            // 清除舊的計時器
            clearTimeout(scrollTimer);

            // 閒置10 秒後重新顯示
            scrollTimer = setTimeout(() => {
                pwaBanner.classList.remove('hidden-scroll');
            }, 10000);
        }, { passive: true });

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Registered!', reg))
                    .catch(err => console.log('SW Reg error:', err));
            });
        }

        const overlay = document.getElementById('portal-overlay');
        const userList = document.getElementById('user-list');
        const quickUserMenu = document.getElementById('quick-user-menu');
        const quickBackdrop = document.getElementById('quick-menu-backdrop');
        const params = new URLSearchParams(window.location.search);
        const userParam = params.get('u');

        // 切換快速選單
        window.toggleQuickMenu = () => {
            quickUserMenu.classList.toggle('open');
            quickBackdrop.classList.toggle('open');
            document.querySelector('.quick-switch-btn').classList.toggle('active');
        };

        async function initPortalAndQuickSwitch() {
            // 禁止 body 滑動 (如果還在入口頁)
            if (!userParam) document.body.classList.add('no-scroll');

            // Portal Logo
            const logoText = "NO Live • NO LIFE • ";
            const pLogo = document.getElementById('portal-logo');
            logoText.split('').forEach((char, i) => {
                const span = document.createElement('span');
                span.textContent = char;
                span.setAttribute('style', `--index: ${i}; --angle: ${(i / 20) * 360}deg;`);
                pLogo.appendChild(span);
            });

            try {
                const res = await fetch(`${GAS_API_URL}?action=getUsers`);
                const users = await res.json();
                
                userList.innerHTML = '';
                quickUserMenu.innerHTML = '';

                // 找出 ching 的資料作為 MASTER，其餘為 GUEST
                const masterData = users.find(u => u.username === 'ching') || { username: 'ching', display_name: 'CHING (MASTER)' };
                const filteredUsers = users.filter(u => u.username !== 'ching');
                
                const usersWithMaster = [
                    { ...masterData, display_name: 'CHING (MASTER)', isMaster: true }, 
                    ...filteredUsers
                ];
                
                usersWithMaster.forEach((u, index) => {
                    const isCurrent = (u.username === userParam) || (u.isMaster && !userParam);
                    
                    // 1. 入口頁卡片
                    const card = document.createElement('div');
                    card.className = 'user-card';
                    // 加入交錯延遲效果，從 0.5s 開始 (等標題動畫)，每張間隔 0.15s
                    card.style.animationDelay = `${0.5 + index * 0.15}s`;
                    card.onclick = () => {
                        if (u.isMaster) window.location.href = 'index.html';
                        else window.location.href = `shared.html?u=${u.username}`;
                    };
                    card.innerHTML = `
                        <div class="user-avatar">${u.avatar_url ? `<img src="${u.avatar_url}">` : '<i data-lucide="user" style="color:#444; width:40px; height:40px;"></i>'}</div>
                        <div class="user-name">${u.display_name}</div>
                        <div class="user-badge">${u.isMaster ? 'MASTER PASS' : 'GUEST PASS'}</div>
                    `;
                    userList.appendChild(card);

                    // 2. 垂直懸浮選單頭像
                    const item = document.createElement('div');
                    item.className = `quick-user-item ${isCurrent ? 'active' : ''}`;
                    item.title = u.display_name;
                    item.onclick = () => {
                        if (u.isMaster) window.location.href = 'index.html';
                        else window.location.href = `shared.html?u=${u.username}`;
                    };
                    item.innerHTML = u.avatar_url 
                        ? `<img src="${u.avatar_url}">` 
                        : `<i data-lucide="user" style="width:18px; color:#555;"></i>`;
                    
                    quickUserMenu.appendChild(item);
                });
                lucide.createIcons();

                // 載入完成後：開啟滑動
                overlay.style.overflowY = 'auto';
                // 如果之後需要 body 也能滑動 (例如 overlay 消失後)，則解除 no-scroll
                // 但入口頁本來就不該讓 body 滑動，所以主要維持 overlay.style.overflowY = 'auto' 即可
            } catch (e) {
                userList.innerHTML = '<p style="color:red; grid-column: 1/-1;">Error: Unable to fetch users.</p>';
            }
        }

        if (userParam) { overlay.classList.add('hidden'); }
        initPortalAndQuickSwitch();

        // 點擊外面關閉選單
        window.addEventListener('click', (e) => {
            if (!e.target.closest('.quick-switch-container')) {
                quickUserMenu.classList.remove('open');
                quickBackdrop.classList.remove('open');
                document.querySelector('.quick-switch-btn').classList.remove('active');
            }
        });
    </script>
</body>
</html>
